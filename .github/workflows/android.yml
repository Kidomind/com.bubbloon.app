
name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm install

      - name: www klasorunu hazirla
        run: |
          mkdir -p www
          cp index.html iap-bridge.js manifest.json icon.png www/

      - name: Android projesini olustur
        run: npm run android:add

      - name: Ikon ve splash uret
        run: npm run assets

      - name: Senkronla
        run: npm run sync

      - name: Android ikonlarini duzelt
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          root = Path("android/app/src/main/res")
          source = Image.open("icon.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  source, (size, size),
                  method=Image.Resampling.LANCZOS
              )

              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          for folder in root.glob("mipmap-anydpi*"):
              for name in [
                  "ic_launcher.xml",
                  "ic_launcher_round.xml"
              ]:
                  path = folder / name
                  if path.exists():
                      path.unlink()

          print("Launcher icons corrected.")
          PY

      - name: Surum kodunu ayarla
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $(( ${{ github.run_number }} + 200 ))/" android/app/build.gradle

      - name: Android SDK ayarlarini yap
        run: |
          sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 24/" android/variables.gradle
          sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: AdMob ve AD_ID izinlerini duzelt
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          p = "android/app/src/main/AndroidManifest.xml"

          NS = "http://schemas.android.com/apk/res/android"
          TOOLS = "http://schemas.android.com/tools"

          ET.register_namespace("android", NS)
          ET.register_namespace("tools", TOOLS)

          tree = ET.parse(p)
          root = tree.getroot()

          name_attr = "{" + NS + "}name"
          value_attr = "{" + NS + "}value"

          permission = "com.google.android.gms.permission.AD_ID"

          for item in list(root):
              if item.tag in ("uses-permission", "uses-permission-sdk-23"):
                  if item.get(name_attr) == permission:
                      root.remove(item)

          perm = ET.Element("uses-permission")
          perm.set(name_attr, permission)
          root.insert(0, perm)

          app = root.find("application")
          assert app is not None, "Application element missing"

          for item in list(app):
              if item.tag == "meta-data":
                  if item.get(name_attr) == "com.google.android.gms.ads.APPLICATION_ID":
                      app.remove(item)

          meta = ET.SubElement(app, "meta-data")
          meta.set(name_attr, "com.google.android.gms.ads.APPLICATION_ID")
          meta.set(value_attr, "ca-app-pub-3467001631229747~9723035555")

          tree.write(p, encoding="utf-8", xml_declaration=True)

          assert any(
              item.get(name_attr) == permission
              for item in root.findall("uses-permission")
          ), "AD_ID permission missing"

          print("AdMob App ID and AD_ID permission added.")
          PY

          cat android/app/src/main/AndroidManifest.xml

      - name: Gradle izinlerini ayarla
        run: chmod +x android/gradlew

      - name: Test APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Flag-Shooter-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: AAB derle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Derlenmis manifest AD_ID kontrolu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("android/app/build/intermediates")
          ns = "{http://schemas.android.com/apk/res/android}"
          permission = "com.google.android.gms.permission.AD_ID"

          manifests = [
              p for p in root.rglob("AndroidManifest.xml")
              if "release" in str(p).lower()
              and "merged_manifest" in str(p)
          ]

          assert manifests, "Release merged manifest not found"

          for p in manifests:
              manifest = ET.parse(p).getroot()

              valid = any(
                  item.get(ns + "name") == permission
                  and item.get(ns + "maxSdkVersion") is None
                  for item in manifest.findall("uses-permission")
              )

              assert valid, f"AD_ID missing or restricted: {p}"
              print(f"AD_ID verified: {p}")
          PY

      - name: AAB imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)

          test -n "$AAB"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

          cp "$AAB" Flag-Shooter-release.aab

          rm -f release.keystore

      - name: AAB yukle
        uses: actions/upload-artifact@v4
        with:
          name: Flag-Shooter-AAB
          path: Flag-Shooter-release.aab
          if-no-files-found: error
