
name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm install

      - name: www klasorunu hazirla
        run: |
          mkdir -p www
          cp index.html iap-bridge.js manifest.json icon.png www/

      - name: Android projesini olustur
        run: npm run android:add

      - name: Ikon ve splash uret
        run: npm run assets

      - name: Senkronla
        run: npm run sync

      - name: Android ikonlarini duzelt
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          root = Path("android/app/src/main/res")
          source = Image.open("icon.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  source, (size, size),
                  method=Image.Resampling.LANCZOS
              )

              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          for folder in root.glob("mipmap-anydpi*"):
              for name in [
                  "ic_launcher.xml",
                  "ic_launcher_round.xml"
              ]:
                  path = folder / name
                  if path.exists():
                      path.unlink()

          print("Launcher icons corrected.")
          PY

      - name: AdMob App ID yaz
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          APP_ID='ca-app-pub-3467001631229747~9723035555'
          tag='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % APP_ID
          pat=r'<meta-data\s+android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"[^>]*/>'
          if re.search(pat,s):
              s=re.sub(pat,tag,s)
          else:
              s=s.replace('</application>','    '+tag+'\n    </application>')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Surum kodunu ayarla
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $(( ${{ github.run_number }} + 100 ))/" android/app/build.gradle

      - name: minSdk 24 yap
        run: |
          sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 24/" android/variables.gradle

      - name: SDK 36 ve AD_ID
        run: |
          sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perm='<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>'
          if 'permission.AD_ID' not in s:
              s=s.replace('</manifest>','    '+perm+'\n</manifest>')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Gradle izinlerini ayarla
        run: chmod +x android/gradlew

      - name: Test APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Flag-Shooter-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: AAB derle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: AAB imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)

          test -n "$AAB"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

          cp "$AAB" Flag-Shooter-release.aab

          rm -f release.keystore

      - name: AAB yukle
        uses: actions/upload-artifact@v4
        with:
          name: Flag-Shooter-AAB
          path: Flag-Shooter-release.aab
          if-no-files-found: error
